name: npm publish

# 方案 A（tag 触发）：推送 vX.Y.Z 标签即自动发布到公共 npm registry；
# workflow_dispatch 提供手动兜底。版本管理：npm version patch/minor/major + 打 tag。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance（供应链签名，需 publishConfig.provenance 与 npm≥9.2）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke tests (publish gate)
        run: npm run smoke

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
