summary-en: Turn a story idea into a complete, coherent short film — brief, outline, character/scene/prop cards (every character gets both a single-view and a three-view card; the user picks which one video references at step 0 — fast allows only single, balanced/quality allow either, with single-view fallback), seven-column shot table, storyboard, per-shot prompt bank where every tier uses the same quality prompt, per-shot video and final assembly (per-shot or batch clip review; burned-in subtitles are a step-0 choice — on by default, off keeps the dialogue audio but burns no text) — in any of seven built-in visual styles.
summary-cn: 根据故事创意完成角色/场景/道具设定、镜头规划、分镜生成与视频合成（片段人工确认可选逐镜审查或批量审查；画面内字幕可开场选择要不要），输出风格统一的短片；内置皮克斯感 3D / 电影真人写实 / 吉卜力 2D 手绘 / 日式二次元赛璐璐 / 水墨东方古风 / 欧美漫画半调 / 国风仙侠 3D 七套视觉风格。
desc-en: Turns a short story idea into a stylized short film in one of seven built-in visual styles (Pixar-like 3D, cinematic live-action, Ghibli-style 2D, Japanese cel-shaded anime, Chinese ink-wash, American comic halftone, Chinese Guofeng xianxia 3D). It builds the brief, outline, character / scene / prop cards (every character gets two versions — a single-view full-body card and a three-view turnaround, paired by character/cardVariant/pairedNodeId; the user chooses the reference version at step 0 — `fast` allows only the single view, `balanced`/`quality` allow single or three-view — and the flow falls back to the single-view card if a non-fast render shows reference-form contamination), seven-column continuity-safe shot table (with a `续接`/continuation column), text storyboard, a per-shot prompt bank where fast/balanced/quality all store the same quality prompt on the canvas, single-shot clips, assembly, and final quality review. At step 0 the user also picks the clip review cadence — per-shot (each clip confirmed before the next is rendered, default) or batch (all clips rendered, then one confirmation card) — while AI self-check still runs per shot in both modes. It also asks whether burned-in subtitles are wanted — on by default; off keeps the dialogue audio and `<d>` speaker binding but writes no subtitle declaration, so the finished film carries no subtitles (there is no post-production subtitle track). The default video workflow comes from the capability registry (currently MiniMax-H3); another workflow is used only after the user explicitly selects it and its capabilities are checked. Reference-image shape is gated on the `fast` tier, which is the only tier where multi-subject references leak into the output. Best for coherent narrative shorts, not single images or unrelated clips.
desc-cn: 面向希望把故事创意制作成完整风格化短片的创作者。开场先选定视觉风格（内置七套）、视频档位与**角色卡引用版本（用户选择：fast 只能单视图；balanced·quality 可选单视图或三视图；每个角色固定出两版）**、**图片档位（默认 quality）**、**片段审查节奏（逐镜审查 per-shot，默认 / 批量审查 batch：全部渲完一次确认）**与交付规格，**开场还会问要不要画面内原生字幕（要 = 逐字烧进画面，默认；不要 = 对白照常发声但不写字幕声明，成片无字幕——本流程没有后期字幕轨）**，Skill 依次完成项目简报、故事大纲、角色卡（双版本）、无人物场景卡、单视图道具卡、连续性镜头表、文本分镜、每镜提示词库（fast/balanced/quality 三段同文，共用 quality 提示词）、单镜头视频、成片合成与质量复查；两种审查节奏下 AI 自检都逐镜执行，差别只在人工确认的时机。换档重渲读同一份 quality 文本，不重写；非 fast 档若出现参考图形态类污染（多角色副本 / 版面投影），先退回同角色单视图卡重渲。默认使用能力注册表的视频工作流（当前 MiniMax-H3）；用户明确指定其他模型/工作流时先用 comfy_list_workflows 检查能力再执行，失败会按原因重试并切换可用工作流。参考图形态门禁只在 fast 档启用——fast 档下多主体参考图会产生角色副本或画面污染，balanced/quality 实测干净、可正常使用多视图角色卡。适合剧情短片，不适合单图或无关联镜头，强调角色统一与镜头衔接。
