summary-en: Write a full vertical micro-drama series — topic, audience, characters, hook rhythm, paywall beats, episode outline, episode scripts and export (50–100 episodes, domestic or overseas), script only.
summary-cn: 从选题、受众、人物、爽点节奏、付费卡点到分集大纲与单集剧本，写出 50–100 集竖屏微短剧剧本并导出；纯剧本，不出视频；export 只做剧本汇编（不含分镜/镜头表），生产交接物由 series-production 生成。
desc-en: Vendored from 0xsline/short-drama (MIT) for dsh-short-video-studio. Full-process short-drama scriptwriting — genre selection, audience, tone, character system, episode directory with hooks and paywall markers, per-episode scripts with scenes, actions, verbatim dialogue and end hooks (no shot lists or shot counts), self-review scoring, compliance scan, overseas (ReelShort/DramaBox) formatting, and a script-only export. It is the script layer used by short-drama-series-production, produces text only, and never calls image/video generation.
desc-cn: 自 0xsline/short-drama（MIT）收编进 dsh-short-video-studio 的剧本层。微短剧全流程剧本创作：题材、受众、基调、人物体系、带钩子与付费卡点的分集目录、含场次/动作/逐字对白/结尾钩子的分集剧本（不写分镜与镜头数）、质量自检评分、合规扫描、出海（ReelShort/DramaBox）格式与纯剧本导出。它是 short-drama-series-production 的剧本层：只产出文本，不调用任何图片/视频生成；export 仅供审阅归档，生产交接物是 series-production 的「集制作包」。
